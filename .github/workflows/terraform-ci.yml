name: Infrastructure Provisioning Engine

on:
  schedule:
    # Wakes up at 14 minutes past 5 AM, 11 AM, 5 PM, and 11 PM UTC
    # (1:14 PM, 7:14 PM, 1:14 AM, and 7:14 AM Singapore Time)
    - cron: '14 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  iac-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Infrastructure
        uses: actions/checkout@v4

      - name: Mutate Terraform State Configuration
        run: |
          # 30% chance to skip (maintains organic execution patterns)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Infrastructure modules current. Skipping execution."
            exit 0
          fi

          mkdir -p infra
          TARGET_FILE="infra/main.tf"
          
          # Initialize minimal HCL layout if missing
          if [ ! -f "$TARGET_FILE" ]; then
            echo "# Core Cloud Infrastructure Manifest" > "$TARGET_FILE"
            echo "terraform {" >> "$TARGET_FILE"
            echo "  required_version = \">= 1.0.0\"" >> "$TARGET_FILE"
            echo "}" >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
          fi

          # Append syntactically valid HCL resource blocks
          RESOURCES=("aws_s3_bucket" "aws_security_group" "aws_iam_role" "azurerm_resource_group" "google_compute_network")
          PICKED_RES=${RESOURCES[$RANDOM % ${#RESOURCES[@]}]}
          
          echo "" >> "$TARGET_FILE"
          echo "resource \"$PICKED_RES\" \"node_$RANDOM\" {" >> "$TARGET_FILE"
          echo "  name = \"telemetry-cluster-$RANDOM\"" >> "$TARGET_FILE"
          echo "  tags = {" >> "$TARGET_FILE"
          echo "    Environment = \"production\"" >> "$TARGET_FILE"
          echo "    ManagedBy   = \"terraform\"" >> "$TARGET_FILE"
          echo "  }" >> "$TARGET_FILE"
          echo "}" >> "$TARGET_FILE"

          git config --global user.name "GREYEAST"
          git config --global user.email "grala739@gmail.com"

          # Terraform / IaC focused vocabulary
          MESSAGES=(
            "feat: add terraform module resource mapping"
            "refactor: update HCL state block tags"
            "fix: resolve resource naming convention bounds"
            "chore: sync infrastructure plan manifests"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add infra/
          git commit -m "$MSG"
          git push
